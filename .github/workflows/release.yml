name: Forráskiadás közzététele

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Verzió, kiadási jegyzet és ZIP ellenőrzése
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$TAG" = "v$version"
          notes="docs/kiadasok/$TAG/README.md"
          test -s "$notes"
          grep -Eq '^!\[.+\]\(\./[^/]+\.png\)' "$notes"
          shopt -s nullglob
          screenshots=( "docs/kiadasok/$TAG/"*.png )
          test "${#screenshots[@]}" -gt 0
          mkdir "$RUNNER_TEMP/postaszamla-release"
          sed -E "s#(\!\[[^]]+\]\()\./([^/]+\.png\))#\1https://raw.githubusercontent.com/$REPOSITORY/$TAG/docs/kiadasok/$TAG/\2#g" \
            "$notes" > "$RUNNER_TEMP/postaszamla-release/jegyzet.md"
          git archive --format=zip --prefix="postaszamla-$TAG/" \
            --output="$RUNNER_TEMP/postaszamla-release/postaszamla-forras.zip" HEAD
          unzip -tq "$RUNNER_TEMP/postaszamla-release/postaszamla-forras.zip"

      - name: GitHub Release közzététele
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            "$RUNNER_TEMP/postaszamla-release/postaszamla-forras.zip#Postaszámla forráskód (ZIP)" \
            --repo "$REPOSITORY" --verify-tag --latest \
            --title "Postaszámla – Kísérőlevelek $TAG" \
            --notes-file "$RUNNER_TEMP/postaszamla-release/jegyzet.md"
