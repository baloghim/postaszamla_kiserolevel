name: Forráskiadás és hordozható Windows-csomag

on:
  push:
    tags: ["v*.*.*"]
    branches: ["migration/qt5-production"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10.11"
          architecture: x64

      - name: Függőségek és tesztek
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --only-binary=:all: ".[desktop,edpd-compat]" "PyInstaller==6.11.1" "pyinstaller-hooks-contrib==2024.10"
          python -c "import fitz; assert fitz.VersionBind == '1.23.26'"
          $PSNativeCommandUseErrorActionPreference = $false
          $tests = python -m unittest discover -s tests -v 2>&1
          $result = $LASTEXITCODE
          $tests | ForEach-Object { Write-Host $_ }
          if ($result -ne 0) {
            $summary = ($tests | Select-Object -Last 28) -join "%0A"
            Write-Host "::error::$summary"
            exit $result
          }

      - name: Kiadási jegyzet és forrás-ZIP
        if: github.ref_type == 'tag'
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(python -c 'from importlib.metadata import version; print(version("postaszamla-kiserolevel"))')
          test "$TAG" = "v$version"
          notes="docs/kiadasok/$TAG/README.md"
          test -s "$notes"
          grep -Eq '^!\[.+\]\(\./[^/]+\.png\)' "$notes"
          shopt -s nullglob
          screenshots=( "docs/kiadasok/$TAG/"*.png )
          test "${#screenshots[@]}" -gt 0
          stage="$(cygpath -u "$RUNNER_TEMP")/postaszamla-release"
          mkdir "$stage"
          sed -E "s#(\!\[[^]]+\]\()\./([^/]+\.png\))#\1https://raw.githubusercontent.com/$REPOSITORY/$TAG/docs/kiadasok/$TAG/\2#g" \
            "$notes" > "$stage/jegyzet.md"
          git archive --format=zip --prefix="postaszamla-$TAG/" \
            --output="$stage/postaszamla-forras.zip" HEAD
          python -m zipfile -t "$stage/postaszamla-forras.zip"

      - name: PyInstaller, csomagolás és kicsomagolt EXE indítása
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $version = python -c 'from importlib.metadata import version; print(version("postaszamla-kiserolevel"))'
          $tag = if ($env:REF_TYPE -eq "tag") { $env:TAG } else { "v$version" }
          python packaging/build_windows.py $tag (Join-Path $env:RUNNER_TEMP "postaszamla-release")

      - name: GitHub Release közzététele
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $stage = Join-Path $env:RUNNER_TEMP "postaszamla-release"
          $source = Join-Path $stage "postaszamla-forras.zip"
          $windows = Join-Path $stage "Postaszamla-${env:TAG}-win64.zip"
          gh release create $env:TAG `
            "$source#Postaszámla forráskód (ZIP)" `
            "$windows#Hordozható Windows x64 alkalmazás (ZIP)" `
            --repo $env:REPOSITORY --verify-tag --latest `
            --title "Postaszámla – Kísérőlevelek $env:TAG" `
            --notes-file (Join-Path $stage "jegyzet.md")
