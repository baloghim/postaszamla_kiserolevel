name: Forráskiadás és hordozható Windows-csomag

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.9"
          architecture: x64

      - name: Függőségek és tesztek
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --only-binary=:all: ".[desktop]" "PyInstaller==6.11.1" "pyinstaller-hooks-contrib==2024.10"
          python -m unittest discover -s tests -v

      - name: Kiadási jegyzet és forrás-ZIP
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "$TAG" = "v$version"
          notes="docs/kiadasok/$TAG/README.md"
          test -s "$notes"
          grep -Eq '^!\[.+\]\(\./[^/]+\.png\)' "$notes"
          shopt -s nullglob
          screenshots=( "docs/kiadasok/$TAG/"*.png )
          test "${#screenshots[@]}" -gt 0
          stage="$(cygpath -u "$RUNNER_TEMP")/postaszamla-release"
          mkdir "$stage"
          sed -E "s#(\!\[[^]]+\]\()\./([^/]+\.png\))#\1https://raw.githubusercontent.com/$REPOSITORY/$TAG/docs/kiadasok/$TAG/\2#g" \
            "$notes" > "$stage/jegyzet.md"
          git archive --format=zip --prefix="postaszamla-$TAG/" \
            --output="$stage/postaszamla-forras.zip" HEAD
          python -m zipfile -t "$stage/postaszamla-forras.zip"

      - name: PyInstaller, csomagolás és kicsomagolt EXE indítása
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python packaging/build_windows.py $env:TAG (Join-Path $env:RUNNER_TEMP "postaszamla-release")

      - name: GitHub Release közzététele
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $stage = Join-Path $env:RUNNER_TEMP "postaszamla-release"
          $source = Join-Path $stage "postaszamla-forras.zip"
          $windows = Join-Path $stage "Postaszamla-${env:TAG}-win64.zip"
          gh release create $env:TAG `
            "$source#Postaszámla forráskód (ZIP)" `
            "$windows#Hordozható Windows x64 alkalmazás (ZIP)" `
            --repo $env:REPOSITORY --verify-tag --latest `
            --title "Postaszámla – Kísérőlevelek $env:TAG" `
            --notes-file (Join-Path $stage "jegyzet.md")
