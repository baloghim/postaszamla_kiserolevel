name: Qt 5 prototípus Windows-ellenőrzése

on:
  push:
    branches: [prototype/qt5-luna]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: baloghim/beerkezett_posta_kezeles
          ref: 543845a5e60eacc43253ea8e28fdd33e611ea4a6
          path: .edpd-reference
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.10.11"
          architecture: x64
      - name: PySide2-tesztek és valódi ablakindítás
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python -m pip install --only-binary=:all: -r prototype/qt5/requirements.txt
          $env:POSTASZAMLA_EDPD_SOURCE = Join-Path $env:GITHUB_WORKSPACE ".edpd-reference"
          $PSNativeCommandUseErrorActionPreference = $false
          $tests = python -m unittest discover -s prototype/qt5/tests -v 2>&1
          $result = $LASTEXITCODE
          $tests | ForEach-Object { Write-Host $_ }
          if ($result -ne 0) {
            $summary = ($tests | Select-Object -Last 45) -join "%0A"
            Write-Host "::error::$summary"
            exit $result
          }
          $PSNativeCommandUseErrorActionPreference = $true
          $measurement = python -m prototype.qt5 --edpd-source $env:POSTASZAMLA_EDPD_SOURCE --measure
          $measurement | Write-Host
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "Indulási mérés (Windows Server 2022)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "    $measurement"
