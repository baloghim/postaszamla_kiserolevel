[project]
name = "postaszamla-kiserolevel"
version = "0.3.0"
description = "Postaszámla-kísérőlevél generálása"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["python-docx==1.2.0", "lxml==6.1.0", "typing-extensions==4.15.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["postaszamla"]

[tool.setuptools.package-data]
postaszamla = ["templates/minta.docx"]

[project.optional-dependencies]
desktop = ["PyMuPDF==1.26.7", "pywin32==311; sys_platform == 'win32'"]
