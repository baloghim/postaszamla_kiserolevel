[project]
name = "postaszamla-kiserolevel"
version = "0.7.0"
description = "Postaszámla-kísérőlevél generálása"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = ["python-docx==1.2.0", "lxml==6.1.0", "typing-extensions==4.15.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["postaszamla", "postaszamla.qt", "postaszamla.qt.edpd_graphics", "postaszamla.qt.edpd_graphics.themes"]

[tool.setuptools.package-data]
postaszamla = ["templates/minta.docx", "icons/*", "icons/original/*.png", "icons/png/*.png"]
"postaszamla.qt.edpd_graphics" = ["assets/*", "assets/**/*"]

[project.optional-dependencies]
desktop = ["PySide2==5.15.2.1", "shiboken2==5.15.2.1", "pypdfium2==5.15.2", "pywin32==311; sys_platform == 'win32'"]
edpd-compat = ["PyMuPDF==1.23.26", "PyMuPDFb==1.23.22"]

[project.gui-scripts]
postaszamla = "postaszamla.gui:main"
